<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>주사위 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 하나의 게임 테이블. 위에 점수판, 가운데 두 플레이어의 주사위, 아래에 굴리기 버튼과 기록. */
:root {
  --table: #e4ede3;
  --panel: #f4f8f3;
  --ink: #1d2a22;
  --muted: #5d6f63;
  --line: #c3d3c4;
  --accent: #c4372c;
  --accent-ink: #ffffff;
  --win: #1f7a4a;
  --die: #fbf7ec;
  --die-edge: #cfc6ae;
  --pip: #1d2a22;
  --pip-one: #c4372c;
  --font-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #0f2a1e;
    --panel: #163826;
    --ink: #eaf3ea;
    --muted: #9fb8a6;
    --line: #2b5340;
    --accent: #ef5a4c;
    --accent-ink: #1a0b09;
    --win: #6fd39a;
    --die: #fbf7ec;
    --die-edge: #b9b096;
    --pip: #1d2a22;
    --pip-one: #c4372c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #0f2a1e;
  --panel: #163826;
  --ink: #eaf3ea;
  --muted: #9fb8a6;
  --line: #2b5340;
  --accent: #ef5a4c;
  --accent-ink: #1a0b09;
  --win: #6fd39a;
  --die: #fbf7ec;
  --die-edge: #b9b096;
  --pip: #1d2a22;
  --pip-one: #c4372c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--table);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 24px 40px;
}
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.rules { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 60ch; }
.rules b { color: var(--ink); font-weight: 700; }

.scoreboard {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
}
.score { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.score.right { text-align: right; }
.score .name { font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.score .pts { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; transition: color .2s; }
.score.lead .pts { color: var(--win); }
.goal { text-align: center; font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.goal b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; color: var(--ink); }

.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.side {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  min-width: 0;
  transition: border-color .2s, box-shadow .2s;
}
.side.won { border-color: var(--win); box-shadow: 0 0 0 2px var(--win) inset; }
.side h2 { margin: 0; font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.dice { display: flex; gap: 12px; justify-content: center; }
.die {
  width: clamp(64px, 17vw, 88px);
  aspect-ratio: 1;
  background: var(--die);
  border: 2px solid var(--die-edge);
  border-radius: 16%;
  box-shadow: 0 3px 0 var(--die-edge), 0 8px 14px rgba(0,0,0,.18);
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 13%;
  place-items: center;
}
.die i { width: 78%; aspect-ratio: 1; border-radius: 50%; background: var(--pip); box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
.die i.one { background: var(--pip-one); width: 100%; }
.die.rolling { animation: tumble .16s linear infinite; }
@keyframes tumble {
  0% { transform: rotate(-9deg) translateY(0); }
  50% { transform: rotate(8deg) translateY(-8px); }
  100% { transform: rotate(-9deg) translateY(0); }
}
.total { font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.total small { font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.tag { min-height: 1.6em; font-size: 0.8rem; font-weight: 700; color: var(--accent); }

.controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.msg { margin: 0; min-height: 1.6em; font-weight: 700; font-size: 1.05rem; text-align: center; text-wrap: balance; }
button {
  font-family: var(--font-display);
  font-size: 1.4rem;
  letter-spacing: 0.04em;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 14px 40px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s, opacity .2s;
  min-width: 200px;
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
button:disabled { opacity: .55; cursor: default; transform: none; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); box-shadow: none; font-size: 1rem; padding: 8px 20px; min-width: 0; font-family: var(--font-body); font-weight: 700; }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.log h3 { margin: 0 0 8px; font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }
.log-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
tr:last-child td { border-bottom: 0; }
td.w-me { color: var(--win); font-weight: 700; }
td.w-cpu { color: var(--accent); font-weight: 700; }
.empty { color: var(--muted); font-size: 0.9rem; margin: 0; }

@media (max-width: 480px) {
  .arena { gap: 10px; }
  .side { padding: 12px 8px; }
  .dice { gap: 8px; }
  .scoreboard { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .die.rolling { animation: none; opacity: .7; }
  button, .side, .score .pts { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>주사위 대결</h1>
    <p class="rules">두 사람이 주사위 2개씩 굴려 <b>합이 큰 쪽이 1점</b>을 얻습니다. 같은 눈 두 개(더블)가 나오면 <b>보너스 1점</b>이 붙습니다. 먼저 7점을 만들면 이깁니다.</p>
  </header>

  <section class="scoreboard" aria-label="점수판">
    <div class="score" id="scoreMe"><span class="name">나</span><span class="pts" id="ptsMe">0</span></div>
    <div class="goal"><b>7</b>점 선취</div>
    <div class="score right" id="scoreCpu"><span class="name">컴퓨터</span><span class="pts" id="ptsCpu">0</span></div>
  </section>

  <section class="arena" aria-live="polite">
    <div class="side" id="sideMe">
      <h2>나</h2>
      <div class="dice" id="diceMe"></div>
      <div class="total" id="totalMe">–</div>
      <div class="tag" id="tagMe"></div>
    </div>
    <div class="side" id="sideCpu">
      <h2>컴퓨터</h2>
      <div class="dice" id="diceCpu"></div>
      <div class="total" id="totalCpu">–</div>
      <div class="tag" id="tagCpu"></div>
    </div>
  </section>

  <section class="controls">
    <p class="msg" id="msg">굴리기 버튼을 눌러 시작하세요.</p>
    <button id="rollBtn" type="button">굴리기</button>
    <button id="resetBtn" type="button" class="ghost" hidden>다시 하기</button>
  </section>

  <section class="log">
    <h3>라운드 기록</h3>
    <div class="log-scroll" id="logBox"><p class="empty">아직 굴린 라운드가 없습니다.</p></div>
  </section>
</div>

<script>
(function () {
  var TARGET = 7;
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    diceMe: $('diceMe'), diceCpu: $('diceCpu'),
    totalMe: $('totalMe'), totalCpu: $('totalCpu'),
    tagMe: $('tagMe'), tagCpu: $('tagCpu'),
    ptsMe: $('ptsMe'), ptsCpu: $('ptsCpu'),
    scoreMe: $('scoreMe'), scoreCpu: $('scoreCpu'),
    sideMe: $('sideMe'), sideCpu: $('sideCpu'),
    msg: $('msg'), roll: $('rollBtn'), reset: $('resetBtn'), log: $('logBox')
  };

  var state, busy;

  function newGame() {
    state = { me: 0, cpu: 0, round: 0, history: [], over: false };
    busy = false;
    drawDice(els.diceMe, [1, 1]);
    drawDice(els.diceCpu, [1, 1]);
    els.totalMe.textContent = '–';
    els.totalCpu.textContent = '–';
    els.tagMe.textContent = '';
    els.tagCpu.textContent = '';
    els.sideMe.classList.remove('won');
    els.sideCpu.classList.remove('won');
    els.msg.textContent = '굴리기 버튼을 눌러 시작하세요.';
    els.roll.hidden = false;
    els.roll.disabled = false;
    els.reset.hidden = true;
    renderScore();
    renderLog();
  }

  function rnd() { return 1 + Math.floor(Math.random() * 6); }

  function drawDice(box, values) {
    box.innerHTML = '';
    values.forEach(function (v) {
      var d = document.createElement('div');
      d.className = 'die';
      d.setAttribute('role', 'img');
      d.setAttribute('aria-label', '주사위 ' + v);
      var on = PIPS[v];
      for (var i = 0; i < 9; i++) {
        var cell = document.createElement('i');
        if (on.indexOf(i) === -1) { cell.style.visibility = 'hidden'; }
        else if (v === 1) { cell.className = 'one'; }
        d.appendChild(cell);
      }
      box.appendChild(d);
    });
  }

  function setRolling(on) {
    [els.diceMe, els.diceCpu].forEach(function (b) {
      Array.prototype.forEach.call(b.children, function (d) { d.classList.toggle('rolling', on); });
    });
  }

  function renderScore() {
    els.ptsMe.textContent = state.me;
    els.ptsCpu.textContent = state.cpu;
    els.scoreMe.classList.toggle('lead', state.me > state.cpu);
    els.scoreCpu.classList.toggle('lead', state.cpu > state.me);
  }

  function renderLog() {
    if (!state.history.length) {
      els.log.innerHTML = '<p class="empty">아직 굴린 라운드가 없습니다.</p>';
      return;
    }
    var rows = state.history.slice().reverse().map(function (h) {
      var who = h.winner === 'me' ? '<td class="w-me">내가 +' + h.pts + '</td>'
              : h.winner === 'cpu' ? '<td class="w-cpu">컴퓨터 +' + h.pts + '</td>'
              : '<td>무승부</td>';
      return '<tr><td>' + h.round + '</td><td>' + h.me.join(' + ') + ' = ' + h.meSum + (h.meDouble ? ' (더블)' : '') +
             '</td><td>' + h.cpu.join(' + ') + ' = ' + h.cpuSum + (h.cpuDouble ? ' (더블)' : '') + '</td>' + who + '</tr>';
    }).join('');
    els.log.innerHTML = '<table><thead><tr><th>라운드</th><th>나</th><th>컴퓨터</th><th>결과</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function play() {
    if (busy || state.over) return;
    busy = true;
    els.roll.disabled = true;
    els.sideMe.classList.remove('won');
    els.sideCpu.classList.remove('won');
    els.tagMe.textContent = '';
    els.tagCpu.textContent = '';
    els.msg.textContent = '굴러가는 중...';
    setRolling(true);

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var duration = reduce ? 250 : 900;
    var t = setInterval(function () {
      drawDice(els.diceMe, [rnd(), rnd()]);
      drawDice(els.diceCpu, [rnd(), rnd()]);
      setRolling(true);
    }, 90);

    setTimeout(function () {
      clearInterval(t);
      var me = [rnd(), rnd()], cpu = [rnd(), rnd()];
      drawDice(els.diceMe, me);
      drawDice(els.diceCpu, cpu);
      settle(me, cpu);
    }, duration);
  }

  function settle(me, cpu) {
    var meSum = me[0] + me[1], cpuSum = cpu[0] + cpu[1];
    var meDouble = me[0] === me[1], cpuDouble = cpu[0] === cpu[1];
    state.round += 1;

    els.totalMe.innerHTML = meSum + '<small>합</small>';
    els.totalCpu.innerHTML = cpuSum + '<small>합</small>';
    if (meDouble) els.tagMe.textContent = '더블! 보너스 +1';
    if (cpuDouble) els.tagCpu.textContent = '더블! 보너스 +1';

    var winner = 'tie', pts = 0;
    if (meSum > cpuSum) { winner = 'me'; pts = 1 + (meDouble ? 1 : 0); }
    else if (cpuSum > meSum) { winner = 'cpu'; pts = 1 + (cpuDouble ? 1 : 0); }

    if (winner === 'me') { state.me += pts; els.sideMe.classList.add('won'); els.msg.textContent = '이번 라운드는 내가 이겼습니다! +' + pts + '점'; }
    else if (winner === 'cpu') { state.cpu += pts; els.sideCpu.classList.add('won'); els.msg.textContent = '컴퓨터가 이겼습니다. +' + pts + '점'; }
    else { els.msg.textContent = '합이 같아서 무승부입니다.'; }

    state.history.push({ round: state.round, me: me, cpu: cpu, meSum: meSum, cpuSum: cpuSum, meDouble: meDouble, cpuDouble: cpuDouble, winner: winner, pts: pts });
    renderScore();
    renderLog();

    if (state.me >= TARGET || state.cpu >= TARGET) {
      state.over = true;
      els.msg.textContent = (state.me >= TARGET ? '내가 이겼습니다! ' : '컴퓨터가 이겼습니다. ') + state.me + ' : ' + state.cpu;
      els.roll.hidden = true;
      els.reset.hidden = false;
      els.reset.focus();
    } else {
      els.roll.disabled = false;
    }
    busy = false;
  }

  els.roll.addEventListener('click', play);
  els.reset.addEventListener('click', newGame);
  newGame();
})();
</script>

</body></html>
